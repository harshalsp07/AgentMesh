services:
  hub:
    build: .
    ports: ["7777:7777"]
    volumes: ["mesh-data:/data"]
    environment:
      MESH_HOST: 0.0.0.0
      MESH_AUTH: 1            # the container generates a keypair on first boot
      MESH_EPOCH: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
  standby:
    build: .
    ports: ["7778:7777"]
    volumes: ["mesh-standby:/data"]
    environment:
      MESH_HOST: 0.0.0.0
      MESH_PORT: 7777
      MESH_AUTH: 1
      MESH_EPOCH: 2             # fenced ahead; promote by pointing traffic here
    profiles: ["standby"]
volumes:
  mesh-data:
  mesh-standby:
