name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --version && git --version
      - run: npm test
      - run: npm run demo:all
      - run: MESH_DIR=.mesh-ci node src/hub.mjs & sleep 2
      - run: node scripts/load.mjs 4 3
      - run: pkill -f "src/hub.mjs" || true; rm -rf .mesh-ci
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentmesh:ci .
