name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --version && git --version
      - run: npm test
      - name: Production hardening gates (auth boundaries, atomic writes, JSON-RPC)
        run: node --test test/hardening.test.mjs
      - run: npm run demo:all
      - name: Conductor demo (dry, asserted)
        run: node demo-bot.mjs
      - name: Non-loopback bind without auth must refuse to start
        run: |
          MESH_HOST=0.0.0.0 MESH_PORT=7799 MESH_DIR=.mesh-ci-insecure node src/hub.mjs; \
            test $? -eq 78 || (echo "hub did not fail closed" && exit 1)
      - name: Browser vendor bundle is fresh (crdt+macp kernels)
        run: |
          node scripts/bundle-sim.mjs
          git diff --exit-code -- site/vendor.mjs
      - name: Publish readiness doctor
        run: node scripts/publish-check.mjs
      - run: MESH_DIR=.mesh-ci node src/hub.mjs & sleep 2
      - run: node scripts/load.mjs 4 3
      - run: pkill -f "src/hub.mjs" || true; rm -rf .mesh-ci
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --version && git --version
      # npm test uses --test-force-exit (Windows test-runner hang guard)
      - run: npm test
        shell: cmd
      - name: Production hardening gates on Windows (atomic writes are Windows-sensitive)
        run: node --test test/hardening.test.mjs
        shell: cmd
      - name: Conductor demo on Windows
        run: node demo-bot.mjs
      - name: Mesh init lands on a foreign repo (TTFC)
        run: |
          node bin/mesh init ci-target --actor ci-win --hub http://127.0.0.1:7777
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('ci-target/.agents/mcp_config.json','utf8'));if(!c.mcpServers||!c.mcpServers.agentmesh)process.exit(1);console.log('mesh init ok')"
      - name: Cleanup
        run: powershell -Command "Remove-Item -Recurse -Force 'ci-target' -ErrorAction SilentlyContinue"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentmesh:ci .
